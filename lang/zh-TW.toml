# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "專業版功能"
trial = "免費試用 30 天"
buy = "了解專業版"
activate = "輸入授權碼"

[pro.preview]
title = "檢視和快速檢視是專業版功能"
body = "F3 檢視視窗和 Ctrl+Q 快速檢視: 文字和程式碼、圖片、PDF、Office 文件、Markdown、網頁、SQLite 資料庫、音訊和影片, 不用開啟其他程式就能檢視; 按 F4 可直接在檢視視窗中編輯。\n\n在免費版中, 按兩下檔案仍會以預設程式開啟。"

[pro.archive]
title = "將壓縮檔當作資料夾瀏覽是專業版功能"
body = "zip、7z、rar、iso、jar / war 等壓縮檔可以像資料夾一樣直接開啟瀏覽, 把檔案複製出來就是解壓縮, 不必先解壓縮到磁碟上。\n\n在免費版中, 按兩下壓縮檔仍會以預設程式開啟。"

[pro.compare]
title = "比較資料夾是專業版功能"
body = "逐項比較左右兩個面板: 哪些只有一邊有、哪些內容不同, 一目了然, 還能直接複製過去同步。"

[pro.usercmd]
title = "自訂指令是專業版功能"
body = "把每天常用的命令列工具放到選單、工具列和快速鍵上, 對選取的檔案一鍵執行。"

[pro.remote]
title = "遠端 SFTP 是專業版功能"
body = "直接在 OB Commander 裡瀏覽伺服器上的目錄: 上傳、下載、重新命名、刪除、新增資料夾, 就像操作本機磁碟一樣。\n\n使用您現有的 SSH 設定 —— 金鑰、agent、跳板主機, 以及 ~/.ssh/config 裡的主機別名, 完全不必重新設定。\n\n其餘基本功能, 個人及家庭使用仍然免費。"

