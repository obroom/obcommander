# OB Commander 繁體中文 (台灣)
# 新增語言: 複製這個檔案並改名成語言標籤 (如 ja-JP.toml), 翻譯等號右邊的文字即可。
# 放在 exe 旁邊的 lang/ 資料夾裡就會自動載入; 同名檔案會覆寫內建的那份。
# 文字裡的 {名稱} 是預留位置, 執行時會換成實際內容, 位置可以調整但不要刪除。

name = "繁體中文"

[delete]
verb = "刪除"
verb_permanent = "永久刪除"
more_items = "\n    ... 還有 {n} 項"
locker_line = "    {name} (PID {pid}, {n} 個控制代碼)"

[delete.root]
title = "刪除磁碟根目錄下的項目"
body = "下列 {n} 項直接位於磁碟根目錄下:\n\n{list}\n\n這一層通常是系統或專案的根目錄, 在這裡刪除影響範圍很大。確定要{how}嗎?"

[delete.locked]
title = "檔案正在使用中"
body = "下列程式正在使用要刪除的檔案:\n\n{list}\n\n強制關閉它們的控制代碼就能刪除檔案, 但這些程式不會知道控制代碼已經不在了 —— 之後的讀寫會失敗, 未儲存的資料可能遺失。\n\n要強制解除鎖定並刪除嗎?"

[delete.locked_still]
title = "仍在使用中"
body = "關閉控制代碼後仍然無法刪除。\n\n{list}\n\n要結束這些程式再試一次嗎? 它們未儲存的資料會遺失。"

