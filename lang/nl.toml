limit_body = "Elke licentie kan op 2 computers worden gebruikt. Open op de computer die u niet meer gebruikt Help > Licentie > Deactiveren op deze computer en activeer daarna hier.\n\nIs de oude computer kapot of opnieuw ingesteld zonder deactivering, mail dan support@obcommander.com en we zetten het voor u terug."
revoked = "Deze licentiesleutel is uitgeschakeld"
revoked_body = "De bestelling is terugbetaald of de sleutel is uitgeschakeld. Hebt u vragen, mail dan support@obcommander.com."
# deactivate: free the seat for another computer
deactivate = "Deactiveren op deze computer"
deactivate_confirm = "Deactiveren op deze computer?"
deactivate_body = "Deze computer gaat terug naar de gratis versie en de activering komt beschikbaar voor een andere computer.\n\nOm Pro hier later weer te gebruiken, voert u de licentiesleutel gewoon opnieuw in."
