# OB Commander Nederlands
# Een taal toevoegen: kopieer dit bestand, geef het de naam van de taalcode (bijv. ja-JP.toml)
# en vertaal de tekst rechts van elk "=".
# Zet het in de map lang/ naast het exe-bestand en het wordt automatisch geladen;
# een bestand met dezelfde naam vervangt het ingebouwde bestand.
# {accolades} zijn tijdelijke aanduidingen die tijdens het uitvoeren worden ingevuld — u mag ze verplaatsen, maar niet verwijderen.

name = "Nederlands"

[delete]
verb = "Verwijderen"
verb_permanent = "Definitief verwijderen"
more_items = "\n    ... en nog {n}"
locker_line = "    {name} (PID {pid}, {n} ingang(en))"

[delete.root]
title = "Items in de hoofdmap van een station verwijderen"
body = "{n} item(s) staan direct in de hoofdmap van een station:\n\n{list}\n\nDit niveau bevat meestal systeem- of projectmappen — verwijderen heeft hier grote gevolgen. {how}: toch doorgaan?"

[delete.locked]
title = "Bestand in gebruik"
body = "Deze programma's houden de bestanden open:\n\n{list}\n\nAls hun ingangen geforceerd worden gesloten, kan het verwijderen doorgaan, maar die programma's weten niet dat de ingang weg is — verder lezen of schrijven mislukt en niet-opgeslagen gegevens kunnen verloren gaan.\n\nGeforceerd ontgrendelen en verwijderen?"

[delete.locked_still]
title = "Nog steeds in gebruik"
body = "Kan nog steeds niet worden verwijderd nadat de ingangen zijn gesloten.\n\n{list}\n\nDeze programma's beëindigen en opnieuw proberen? Hun niet-opgeslagen gegevens gaan verloren."

