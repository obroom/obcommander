active_body = "Gelicentieerd aan {email}\nUitgegeven {date}\n\nBedankt voor uw steun."
free = "Gratis voor persoonlijk en thuisgebruik"
free_body = "Persoonlijk en thuisgebruik (niet-commercieel) van de basisfuncties is gratis.\n\nEen licentie is vereist voor:\n  · commercieel gebruik: gebruik voor een bedrijf, een organisatie of voor werk, inclusief freelancewerk en thuiswerken (30 dagen gratis te evalueren)\n  · Pro-functies: F3-viewer en Ctrl+Q snelle weergave, archieven bladeren als mappen, onthouden mapgrootten, mappen vergelijken, aangepaste opdrachten, externe SFTP\n\nPro kan 30 dagen gratis worden geprobeerd, geen creditcard nodig. De licentieovereenkomst bevat de exacte definities."
# trial
trial = "Pro-proefversie: nog {days} dagen"
trial_body = "Uw proefperiode loopt tot {date}. Tot dan is elke Pro-functie beschikbaar.\n\nDaarna gaat u terug naar de gratis versie; uw bestanden en instellingen worden niet beïnvloed. Koop een licentie en voer de code in om Pro te behouden."
trial_over = "Uw Pro-proefperiode is afgelopen"
trial_over_body = "De proefperiode is geëindigd op {date}. Pro-functies zijn uitgeschakeld; de basisfuncties blijven werken (gratis voor persoonlijk en thuisgebruik).\n\nKoop een licentie en voer de code in om Pro terug te krijgen."
trial_ended_on = "Uw proefperiode is geëindigd op {date}."
trial_started = "Proefperiode gestart"
trial_started_body = "Elke Pro-functie is beschikbaar tot {date}.\n\nGeen creditcard nodig — wanneer de periode afloopt, gaat u automatisch terug naar de gratis versie."
trial_used = "Deze computer heeft al een proefperiode gehad"
trial_used_body = "De proefperiode op deze computer is geëindigd op {date}. Elke computer kan één keer proberen.\n\nKoop een licentie en voer de code in om Pro te gebruiken."
paste_hint = "Plak de licentiesleutel uit uw aankoopmail, zoals ABCDE-FGHIJ-KLMNO-PQRST-UVWXY"
ok = "Geactiveerd"
ok_body = "Gelicentieerd aan {email}. Bedankt voor uw steun."
bad = "Die licentiesleutel werkt niet"
bad_body = "Mogelijk is hij onvolledig gekopieerd, of het is geen sleutel voor dit programma.\n\nKopieer de volledige sleutel opnieuw uit uw aankoopmail."
# code is valid but cannot be saved next to the exe
