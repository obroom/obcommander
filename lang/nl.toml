# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Pro-functie"
trial = "30 dagen gratis proberen"
buy = "Over Pro"
activate = "Licentiesleutel invoeren"

[pro.preview]
title = "Weergeven en snelle weergave zijn Pro-functies"
body = "De F3-viewer en Ctrl+Q snelle weergave tonen tekst en code, afbeeldingen, PDF, Office-documenten, Markdown, webpagina's, SQLite-databases, audio en video zonder een ander programma te openen; met F4 bewerkt u direct in de viewer.\n\nIn de gratis versie opent dubbelklikken op een bestand het nog steeds in het standaardprogramma."

[pro.archive]
title = "Archieven bladeren als mappen is een Pro-functie"
body = "Open zip, 7z, rar, iso, jar / war en andere archieven als mappen; bestanden eruit kopiëren pakt ze uit, zonder eerst naar schijf uit te pakken.\n\nIn de gratis versie opent dubbelklikken op een archief het nog steeds in het standaardprogramma."

[pro.compare]
title = "Mappen vergelijken is een Pro-functie"
body = "Vergelijk de twee panelen item voor item: zie in één oogopslag wat maar aan één kant bestaat en wat verschilt, en kopieer naar de andere kant om te synchroniseren."

[pro.usercmd]
title = "Aangepaste opdrachten zijn een Pro-functie"
body = "Zet de opdrachtregelprogramma's die u dagelijks gebruikt in het menu, op de werkbalk en onder sneltoetsen, en voer ze in één stap uit op de geselecteerde bestanden."

[pro.remote]
title = "Externe SFTP is een Pro-functie"
body = "Blader door de mappen van een server direct in OB Commander: uploaden, downloaden, naam wijzigen, verwijderen, mappen maken — net als een lokaal station.\n\nHet gebruikt de SSH-instellingen die u al hebt: sleutels, agent, jump hosts en de hostaliassen in ~/.ssh/config. Niets hoeft twee keer te worden ingesteld.\n\nDe andere basisfuncties blijven gratis voor persoonlijk en thuisgebruik."

