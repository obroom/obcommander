cant_save_body = "De code is geldig, maar schrijven naar {path} is mislukt.\n\nHet programma is waarschijnlijk geïnstalleerd in een map waarvoor beheerdersrechten nodig zijn. Voer het één keer uit als administrator en activeer opnieuw, of verplaats het programma naar een plek waar u kunt schrijven (het is draagbaar — kopieer gewoon de map)."
# activating / starting a trial contacts the license server once
net = "Kan de licentieserver niet bereiken"
net_body = "Controleer uw verbinding en probeer het opnieuw.\n\nEen bedrijfsnetwerk blokkeert mogelijk {host} — vraag uw IT-afdeling dit toe te staan, of mail support@obcommander.com en we helpen u."
