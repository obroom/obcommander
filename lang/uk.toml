# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Функція Pro"
trial = "Спробувати 30 днів безкоштовно"
buy = "Докладніше про Pro"
activate = "Ввести ліцензійний ключ"

[pro.preview]
title = "Перегляд і швидкий перегляд — функції Pro"
body = "Переглядач F3 і швидкий перегляд Ctrl+Q показують текст і код, зображення, PDF, документи Office, Markdown, вебсторінки, бази даних SQLite, аудіо й відео без відкриття іншої програми; F4 дає змогу редагувати прямо в переглядачі.\n\nУ безкоштовній версії подвійне клацання файлу, як і раніше, відкриває його в програмі за замовчуванням."

[pro.archive]
title = "Перегляд архівів як папок — функція Pro"
body = "Відкривайте zip, 7z, rar, iso, jar / war та інші архіви як папки; копіювання файлів звідти розпаковує їх, без попереднього розпакування на диск.\n\nУ безкоштовній версії подвійне клацання архіву, як і раніше, відкриває його в програмі за замовчуванням."

[pro.compare]
title = "Порівняння папок — функція Pro"
body = "Порівнюйте дві панелі поелементно: одразу видно, що є лише з одного боку і що відрізняється, а копіюванням на інший бік їх можна синхронізувати."

[pro.usercmd]
title = "Власні команди — функція Pro"
body = "Додайте інструменти командного рядка, якими користуєтеся щодня, до меню, панелі інструментів і сполучень клавіш та запускайте їх для виділених файлів одним кроком."

[pro.remote]
title = "Віддалений SFTP — функція Pro"
body = "Переглядайте каталоги сервера прямо в OB Commander: вивантажуйте, завантажуйте, перейменовуйте, видаляйте, створюйте папки — так само, як на локальному диску.\n\nВикористовуються ваші наявні налаштування SSH: ключі, агент, проміжні хости (jump hosts) і псевдоніми хостів у ~/.ssh/config. Нічого не треба налаштовувати двічі.\n\nІнші базові функції залишаються безкоштовними для особистого й домашнього використання."

