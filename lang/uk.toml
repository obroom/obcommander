# OB Commander — українська
# Щоб додати мову: скопіюйте цей файл, перейменуйте його за тегом мови (наприклад, ja-JP.toml)
# і перекладіть текст праворуч від кожного «=».
# Покладіть його в папку lang/ поруч з exe-файлом — його буде підхоплено автоматично;
# файл із таким самим ім'ям замінює вбудований.
# {фігурні дужки} — підстановки, які заповнюються під час роботи: їх можна переносити, але не видаляти.

name = "Українська"

[delete]
verb = "Видалити"
verb_permanent = "Остаточно видалити"
more_items = "\n    ... і ще {n}"
locker_line = "    {name} (PID {pid}, дескрипторів: {n})"

[delete.root]
title = "Видалення елементів у корені диска"
body = "Елементів безпосередньо в корені диска: {n}\n\n{list}\n\nНа цьому рівні зазвичай лежать системні папки або корені проєктів — видалення тут має широкі наслідки. {how} попри це?"

[delete.locked]
title = "Файл використовується"
body = "Ці програми тримають файл(и) відкритими:\n\n{list}\n\nПримусове закриття їхніх дескрипторів дасть змогу видалити файл, але ці програми не дізнаються, що дескриптора вже немає — подальше читання чи запис завершаться помилкою, а незбережені дані може бути втрачено.\n\nПримусово розблокувати й видалити?"

[delete.locked_still]
title = "Досі використовується"
body = "Після закриття дескрипторів видалити досі не вдається.\n\n{list}\n\nЗавершити ці програми й повторити спробу? Їхні незбережені дані буде втрачено."

