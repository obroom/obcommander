# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Funkce Pro"
trial = "Vyzkoušet 30 dní zdarma"
buy = "O verzi Pro"
activate = "Zadat licenční klíč"

[pro.preview]
title = "Prohlížení a rychlé zobrazení jsou funkce Pro"
body = "Prohlížeč F3 a rychlé zobrazení Ctrl+Q zobrazí text a kód, obrázky, PDF, dokumenty Office, Markdown, webové stránky, databáze SQLite, zvuk a video bez otevírání dalšího programu; F4 upravuje přímo v prohlížeči.\n\nV bezplatné verzi dvojklik na soubor dál otevře soubor ve výchozím programu."

[pro.archive]
title = "Procházení archivů jako složek je funkce Pro"
body = "Otevírejte archivy zip, 7z, rar, iso, jar / war a další jako složky; kopírováním souborů ven je rozbalíte, bez nutnosti je nejdřív rozbalit na disk.\n\nV bezplatné verzi dvojklik na archiv dál otevře archiv ve výchozím programu."

[pro.compare]
title = "Porovnání složek je funkce Pro"
body = "Porovnejte oba panely položku po položce: na první pohled uvidíte, co je jen na jedné straně a co se liší, a zkopírováním na druhou stranu je synchronizujete."

[pro.usercmd]
title = "Vlastní příkazy jsou funkce Pro"
body = "Umístěte nástroje příkazového řádku, které denně používáte, do nabídky, na panel nástrojů a na klávesové zkratky a spouštějte je na vybraných souborech jedním krokem."

[pro.remote]
title = "Vzdálené SFTP je funkce Pro"
body = "Procházejte adresáře serveru přímo v OB Commander: nahrávání, stahování, přejmenování, odstranění, vytváření složek — jako na místní jednotce.\n\nPoužívá nastavení SSH, které už máte: klíče, agenta, jump hosty a aliasy hostitelů v ~/.ssh/config. Nic se nekonfiguruje dvakrát.\n\nOstatní základní funkce zůstávají zdarma pro osobní a domácí použití."

