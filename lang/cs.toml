# OB Commander čeština
# Přidání jazyka: zkopírujte tento soubor, přejmenujte ho na značku jazyka (např. ja-JP.toml)
# a přeložte text napravo od každého „=“.
# Vložte ho do složky lang/ vedle exe a načte se automaticky;
# soubor se stejným názvem přepíše vestavěný.
# {složené závorky} jsou zástupné symboly vyplňované za běhu — můžete je přesunout, ale nemažte je.

name = "Čeština"

[delete]
verb = "Odstranit"
verb_permanent = "Trvale odstranit"
more_items = "\n    ... a další ({n})"
locker_line = "    {name} (PID {pid}, popisovače: {n})"

[delete.root]
title = "Odstranění položek v kořeni jednotky"
body = "Položky přímo v kořeni jednotky ({n}):\n\n{list}\n\nNa této úrovni obvykle leží systémové nebo projektové kořenové složky — odstranění zde má široký dopad. {how} i přesto?"

[delete.locked]
title = "Soubor se používá"
body = "Tyto programy mají soubor(y) otevřené:\n\n{list}\n\nVynucené zavření jejich popisovačů umožní odstranění, ale tyto programy se nedozví, že popisovač zmizel — další čtení nebo zápis selže a neuložená data mohou být ztracena.\n\nVynutit odemknutí a odstranit?"

[delete.locked_still]
title = "Stále se používá"
body = "Ani po zavření popisovačů nelze odstranit.\n\n{list}\n\nUkončit tyto programy a zkusit to znovu? Jejich neuložená data budou ztracena."

