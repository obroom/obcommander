# Help > License
active = "라이선스 인증됨"
active_body = "라이선스 사용자: {email}\n발급일: {date}\n\n지원해 주셔서 감사합니다."
free = "개인 및 가정용은 무료"
free_body = "기본 기능은 개인 및 가정용(비상업적) 사용 시 무료입니다.\n\n다음의 경우에는 라이선스가 필요합니다.\n  · 상업적 사용: 회사나 단체를 위한 사용 또는 업무용 사용(프리랜서 업무 및 재택근무 포함) (30일 동안 무료로 평가 가능)\n  · Pro 기능: F3 뷰어 및 Ctrl+Q 빠른 보기, 압축 파일을 폴더처럼 탐색, 폴더 크기 기억, 폴더 비교, 사용자 지정 명령, 원격 SFTP\n\nPro는 카드 등록 없이 30일 동안 무료로 체험할 수 있습니다. 정확한 정의는 라이선스 계약을 참조하세요."
# trial
trial = "Pro 체험판: {days}일 남음"
