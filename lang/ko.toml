# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Pro 기능"
trial = "30일 무료 체험"
buy = "Pro 정보"
activate = "라이선스 키 입력"

[pro.preview]
title = "보기 및 빠른 보기는 Pro 기능입니다"
body = "F3 뷰어와 Ctrl+Q 빠른 보기에서는 텍스트와 코드, 이미지, PDF, Office 문서, Markdown, 웹 페이지, SQLite 데이터베이스, 오디오, 비디오를 다른 프로그램을 열지 않고 볼 수 있으며, F4를 누르면 뷰어에서 바로 편집할 수 있습니다.\n\n무료 버전에서도 파일을 두 번 클릭하면 기본 프로그램으로 열립니다."

[pro.archive]
title = "압축 파일을 폴더처럼 탐색하는 기능은 Pro 기능입니다"
body = "zip, 7z, rar, iso, jar / war 등의 압축 파일을 폴더처럼 열 수 있습니다. 파일을 복사해 내보내면 바로 압축이 풀리므로 먼저 디스크에 압축을 풀 필요가 없습니다.\n\n무료 버전에서도 압축 파일을 두 번 클릭하면 기본 프로그램으로 열립니다."

[pro.compare]
title = "폴더 비교는 Pro 기능입니다"
body = "두 패널을 항목별로 비교합니다. 한쪽에만 있는 항목과 서로 다른 항목을 한눈에 확인하고, 반대쪽으로 복사해 동기화할 수 있습니다."

[pro.usercmd]
title = "사용자 지정 명령은 Pro 기능입니다"
body = "매일 쓰는 명령줄 도구를 메뉴, 도구 모음, 바로 가기 키에 등록하고 선택한 파일에 한 번에 실행할 수 있습니다."

[pro.remote]
title = "원격 SFTP는 Pro 기능입니다"
body = "OB Commander 안에서 서버의 디렉터리를 바로 탐색할 수 있습니다. 업로드, 다운로드, 이름 바꾸기, 삭제, 폴더 만들기 등 로컬 드라이브처럼 사용할 수 있습니다.\n\n이미 갖춰진 SSH 설정(키, 에이전트, 점프 호스트, ~/.ssh/config의 호스트 별칭)을 그대로 사용하므로 다시 설정할 필요가 없습니다.\n\n다른 기본 기능은 개인 및 가정용으로 계속 무료입니다."

