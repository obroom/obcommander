trial_over = "Pro 체험 기간이 끝났습니다"
trial_over_body = "체험 기간이 {date}에 끝났습니다. Pro 기능은 꺼졌으며 기본 기능은 계속 작동합니다(개인 및 가정용은 무료).\n\nPro를 다시 사용하려면 라이선스를 구매하고 코드를 입력하세요."
