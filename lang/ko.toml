# OB Commander 한국어
# 언어를 추가하려면: 이 파일을 복사해 언어 태그 이름(예: ja-JP.toml)으로 바꾸고,
# 각 "=" 오른쪽의 텍스트를 번역하세요.
# exe 옆의 lang/ 폴더에 넣으면 자동으로 인식되며,
# 이름이 같은 파일은 기본 제공 파일보다 우선합니다.
# {중괄호}는 실행 시 값이 채워지는 자리 표시자입니다. 위치는 옮겨도 되지만 삭제하지 마세요.

name = "한국어"

[delete]
verb = "삭제"
verb_permanent = "영구적으로 삭제"
more_items = "\n    ... 외 {n}개"
locker_line = "    {name} (PID {pid}, 핸들 {n}개)"

[delete.root]
title = "드라이브 루트의 항목 삭제"
body = "{n}개 항목이 드라이브 루트 바로 아래에 있습니다.\n\n{list}\n\n이 위치에는 보통 시스템이나 프로젝트의 루트가 있어 여기서 삭제하면 영향 범위가 넓습니다. 그래도 {how}하시겠습니까?"

[delete.locked]
title = "파일이 사용 중입니다"
body = "다음 프로그램이 파일을 열고 있습니다.\n\n{list}\n\n이 핸들을 강제로 닫으면 삭제할 수 있지만, 해당 프로그램은 핸들이 닫힌 사실을 알지 못합니다. 이후 읽기나 쓰기가 실패하고 저장하지 않은 데이터가 손실될 수 있습니다.\n\n강제로 잠금을 해제하고 삭제하시겠습니까?"

[delete.locked_still]
title = "아직 사용 중입니다"
body = "핸들을 닫은 후에도 삭제할 수 없습니다.\n\n{list}\n\n이 프로그램을 종료하고 다시 시도하시겠습니까? 저장하지 않은 데이터는 손실됩니다."

