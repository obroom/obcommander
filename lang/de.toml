# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Pro-Funktion"
trial = "30 Tage kostenlos testen"
buy = "Über Pro"
activate = "Lizenzschlüssel eingeben"

[pro.preview]
title = "Anzeige und Schnellansicht sind Pro-Funktionen"
body = "Der F3-Viewer und die Ctrl+Q-Schnellansicht zeigen Text und Code, Bilder, PDF, Office-Dokumente, Markdown, Webseiten, SQLite-Datenbanken, Audio und Video an, ohne ein anderes Programm zu öffnen; mit F4 bearbeiten Sie direkt im Viewer.\n\nIn der kostenlosen Version öffnet ein Doppelklick die Datei weiterhin im Standardprogramm."

[pro.archive]
title = "Archive wie Ordner durchsuchen ist eine Pro-Funktion"
body = "Öffnen Sie zip, 7z, rar, iso, jar / war und andere Archive wie Ordner; beim Herauskopieren werden die Dateien entpackt, ohne vorher alles auf die Festplatte zu entpacken.\n\nIn der kostenlosen Version öffnet ein Doppelklick das Archiv weiterhin im Standardprogramm."

[pro.compare]
title = "Ordnervergleich ist eine Pro-Funktion"
body = "Vergleichen Sie beide Bereiche Element für Element: Sehen Sie auf einen Blick, was nur auf einer Seite existiert und was sich unterscheidet, und kopieren Sie zum Synchronisieren hinüber."

[pro.usercmd]
title = "Eigene Befehle sind eine Pro-Funktion"
body = "Legen Sie Ihre täglich genutzten Befehlszeilentools auf Menü, Symbolleiste und Tastenkombinationen, und führen Sie sie in einem Schritt für die ausgewählten Dateien aus."

[pro.remote]
title = "Remote-SFTP ist eine Pro-Funktion"
body = "Durchsuchen Sie Serververzeichnisse direkt in OB Commander: hochladen, herunterladen, umbenennen, löschen, Ordner erstellen – genau wie auf einem lokalen Laufwerk.\n\nEs nutzt Ihre vorhandene SSH-Einrichtung: Schlüssel, Agent, Jump-Hosts und die Host-Aliase in ~/.ssh/config. Nichts muss doppelt konfiguriert werden.\n\nDie übrigen Grundfunktionen bleiben für private und häusliche Nutzung kostenlos."

