# OB Commander Deutsch
# Neue Sprache hinzufügen: diese Datei kopieren, nach dem Sprach-Tag benennen (z. B. ja-JP.toml)
# und den Text rechts von jedem „=“ übersetzen.
# Legen Sie die Datei in den Ordner lang/ neben der exe – sie wird automatisch erkannt;
# eine Datei mit gleichem Namen ersetzt die integrierte.
# {Klammern} sind Platzhalter, die zur Laufzeit gefüllt werden – Sie dürfen sie verschieben, aber nicht löschen.

name = "Deutsch"

[delete]
verb = "Löschen"
verb_permanent = "Endgültig löschen"
more_items = "\n    ... und {n} weitere"
locker_line = "    {name} (PID {pid}, {n} Handle(s))"

[delete.root]
title = "Elemente im Laufwerksstamm löschen"
body = "{n} Element(e) liegen direkt im Stammverzeichnis eines Laufwerks:\n\n{list}\n\nAuf dieser Ebene liegen meist System- oder Projektordner – Löschen hat hier weitreichende Folgen. {how}: trotzdem fortfahren?"

[delete.locked]
title = "Datei wird verwendet"
body = "Diese Programme halten die Datei(en) geöffnet:\n\n{list}\n\nWenn ihre Handles zwangsweise geschlossen werden, kann gelöscht werden, aber die Programme merken nicht, dass das Handle weg ist – weitere Lese- oder Schreibzugriffe schlagen fehl, und nicht gespeicherte Daten können verloren gehen.\n\nZwangsweise entsperren und löschen?"

[delete.locked_still]
title = "Wird weiterhin verwendet"
body = "Auch nach dem Schließen der Handles nicht löschbar.\n\n{list}\n\nDiese Programme beenden und erneut versuchen? Ihre nicht gespeicherten Daten gehen verloren."

