# OB Commander English
# To add a language: copy this file, rename it to the language tag (e.g. ja-JP.toml),
# and translate the text on the right-hand side of each "=".
# Drop it into the lang/ folder next to the exe and it gets picked up automatically;
# a file with the same name overrides the built-in one.
# {braces} are placeholders filled in at runtime — you may move them, but don't delete them.

name = "English"

[delete]
verb = "Delete"
verb_permanent = "Permanently delete"
more_items = "\n    ... and {n} more"
locker_line = "    {name} (PID {pid}, {n} handle(s))"

[delete.root]
title = "Deleting Items in a Drive Root"
body = "{n} item(s) sit directly in a drive root:\n\n{list}\n\nThis level usually holds system or project roots — deleting here has wide impact. {how} anyway?"

[delete.locked]
title = "File In Use"
body = "These programs are holding the file(s) open:\n\n{list}\n\nForce-closing their handles lets the delete go through, but those programs won't know the handle is gone — further reads or writes will fail and unsaved data may be lost.\n\nForce unlock and delete?"

[delete.locked_still]
title = "Still In Use"
body = "Still undeletable after closing the handles.\n\n{list}\n\nEnd these programs and try again? Their unsaved data will be lost."

