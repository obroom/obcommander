# ── License (license.rs) ────────────────────────────────
[license]
# The line that always shows in the About box
licensed_to = "Licensed to {email}"
personal_use = "Personal and home use (free)"
about_trial = "Pro trial ({days} days left)"
# Help > License
active = "Licensed"
active_body = "Licensed to {email}\nIssued {date}\n\nThank you for your support."
free = "Free for personal and home use"
free_body = "Personal and home (non-commercial) use of the basic features is free.\n\nA license is required for:\n  · commercial use: use for a company, an organisation or for work, including freelance work and working from home (free to evaluate for 30 days)\n  · Pro features: F3 viewer and Ctrl+Q quick view, browsing archives as folders, remembered folder sizes, folder compare, custom commands, remote SFTP\n\nPro can be tried free for 30 days, no card required. The license agreement has the exact definitions."
# trial
trial = "Pro trial: {days} days left"
trial_body = "Your trial runs until {date}. Every Pro feature is available until then.\n\nAfterwards you are back on the free version; your files and settings are not affected. Buy a license and enter the code to keep Pro."
trial_over = "Your Pro trial has ended"
trial_over_body = "The trial ended on {date}. Pro features are switched off; the basic features keep working (free for personal and home use).\n\nBuy a license and enter the code to get Pro back."
trial_ended_on = "Your trial ended on {date}."
trial_started = "Trial started"
trial_started_body = "Every Pro feature is available until {date}.\n\nNo card required — you go back to the free version automatically when it ends."
trial_used = "This computer has already had a trial"
trial_used_body = "The trial on this computer ended on {date}. Each computer can be trialled once.\n\nBuy a license and enter the code to use Pro."
paste_hint = "Paste the license key from your purchase email, like ABCDE-FGHIJ-KLMNO-PQRST-UVWXY"
ok = "Activated"
ok_body = "Licensed to {email}. Thank you for your support."
bad = "That license key didn't work"
bad_body = "It may have been copied incompletely, or it isn't a key for this program.\n\nTry copying the whole key from your purchase email again."
# code is valid but cannot be saved next to the exe
cant_save = "Valid code, but it could not be saved"
cant_save_body = "The code checks out, but writing to {path} failed.\n\nThe program is most likely installed in a folder that needs administrator rights. Run it once as administrator and activate again, or move the program somewhere you can write to (it is portable — just copy the folder)."
# activating / starting a trial contacts the license server once
net = "Can't reach the license server"
net_body = "Please check your connection and try again.\n\nA company network may be blocking {host} — ask your IT team to allow it, or email support@obcommander.com and we'll help."
server = "The license server has a problem"
server_body = "Please try again in a few minutes. If it keeps failing, email support@obcommander.com."
limit = "This license key has no activations left"
limit_body = "Each license can be used on 2 computers. On the computer you no longer use, open Help > License > Deactivate on this computer, then activate here.\n\nIf the old computer is broken or was reset without deactivating, email support@obcommander.com and we'll reset it for you."
revoked = "This license key has been disabled"
revoked_body = "The order was refunded or the key was disabled. If you have questions, email support@obcommander.com."
# deactivate: free the seat for another computer
deactivate = "Deactivate on this computer"
deactivate_confirm = "Deactivate on this computer?"
deactivate_body = "This computer goes back to the free version and the activation becomes available for another computer.\n\nTo use Pro here again later, just enter the license key again."
deactivated = "Deactivated"
deactivated_body = "This computer is back on the free version. The license key can now be activated on another computer."

# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Pro feature"
trial = "Try free for 30 days"
buy = "About Pro"
activate = "Enter license key"

[pro.preview]
title = "Viewing and quick view are Pro features"
body = "The F3 viewer and Ctrl+Q quick view show text and code, images, PDF, Office documents, Markdown, web pages, SQLite databases, audio and video without opening another program; F4 edits right in the viewer.\n\nIn the free version, double-clicking a file still opens it in its default program."

[pro.archive]
title = "Browsing archives as folders is a Pro feature"
body = "Open zip, 7z, rar, iso, jar / war and other archives like folders; copying files out extracts them, with no need to unpack to disk first.\n\nIn the free version, double-clicking an archive still opens it in its default program."

[pro.compare]
title = "Folder compare is a Pro feature"
body = "Compare the two panels item by item: see at a glance what exists on only one side and what differs, and copy across to sync."

[pro.usercmd]
title = "Custom commands are a Pro feature"
body = "Put the command-line tools you use every day on the menu, toolbar and shortcut keys, and run them on the selected files in one step."

[pro.remote]
title = "Remote SFTP is a Pro feature"
body = "Browse a server's directories right inside OB Commander: upload, download, rename, delete, create folders — just like a local drive.\n\nIt uses the SSH setup you already have: keys, agent, jump hosts and the host aliases in ~/.ssh/config. Nothing to configure twice.\n\nThe other basic features stay free for personal and home use."

