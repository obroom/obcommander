# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Funkcja Pro"
trial = "Wypróbuj bezpłatnie przez 30 dni"
buy = "Informacje o Pro"
activate = "Wprowadź klucz licencyjny"

[pro.preview]
title = "Wyświetlanie i szybki podgląd to funkcje Pro"
body = "Przeglądarka F3 i szybki podgląd Ctrl+Q wyświetlają tekst i kod, obrazy, PDF, dokumenty Office, Markdown, strony internetowe, bazy danych SQLite, audio i wideo bez otwierania innego programu; F4 pozwala edytować bezpośrednio w przeglądarce.\n\nW wersji bezpłatnej dwukrotne kliknięcie pliku nadal otwiera go w programie domyślnym."

[pro.archive]
title = "Przeglądanie archiwów jak folderów to funkcja Pro"
body = "Otwieraj archiwa zip, 7z, rar, iso, jar / war i inne jak foldery; kopiowanie plików na zewnątrz je wypakowuje, bez potrzeby wcześniejszego rozpakowywania na dysk.\n\nW wersji bezpłatnej dwukrotne kliknięcie archiwum nadal otwiera je w programie domyślnym."

[pro.compare]
title = "Porównywanie folderów to funkcja Pro"
body = "Porównaj dwa panele element po elemencie: od razu widać, co istnieje tylko po jednej stronie i co się różni, a skopiowanie na drugą stronę je synchronizuje."

[pro.usercmd]
title = "Polecenia własne to funkcja Pro"
body = "Umieść narzędzia wiersza poleceń, których używasz na co dzień, w menu, na pasku narzędzi i pod klawiszami skrótów, i uruchamiaj je na zaznaczonych plikach jednym ruchem."

[pro.remote]
title = "Zdalne SFTP to funkcja Pro"
body = "Przeglądaj katalogi serwera bezpośrednio w OB Commander: przekazuj, pobieraj, zmieniaj nazwy, usuwaj, twórz foldery — tak jak na dysku lokalnym.\n\nKorzysta z Twojej obecnej konfiguracji SSH: kluczy, agenta, hostów pośredniczących i aliasów hostów w ~/.ssh/config. Nic nie trzeba konfigurować dwa razy.\n\nPozostałe funkcje podstawowe pozostają bezpłatne do użytku osobistego i domowego."

