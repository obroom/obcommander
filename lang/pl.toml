trial_body = "Wersja próbna działa do {date}. Do tego czasu dostępne są wszystkie funkcje Pro.\n\nPotem wracasz do wersji bezpłatnej; nie ma to wpływu na Twoje pliki ani ustawienia. Kup licencję i wprowadź kod, aby zachować Pro."
trial_over = "Wersja próbna Pro zakończyła się"
trial_over_body = "Wersja próbna zakończyła się {date}. Funkcje Pro są wyłączone; funkcje podstawowe nadal działają (bezpłatnie do użytku osobistego i domowego).\n\nKup licencję i wprowadź kod, aby odzyskać Pro."
