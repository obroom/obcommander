# OB Commander Polski
# Aby dodać język: skopiuj ten plik, nadaj mu nazwę według tagu języka (np. ja-JP.toml)
# i przetłumacz tekst po prawej stronie każdego „=”.
# Umieść plik w folderze lang/ obok pliku exe, a zostanie wczytany automatycznie;
# plik o tej samej nazwie zastępuje wbudowany.
# {Nawiasy klamrowe} to symbole zastępcze wypełniane w czasie działania — możesz je przenosić, ale nie usuwaj ich.

name = "Polski"

[delete]
verb = "usunąć"
verb_permanent = "trwale usunąć"
more_items = "\n    ... i jeszcze {n}"
locker_line = "    {name} (PID {pid}, dojścia: {n})"

[delete.root]
title = "Usuwanie elementów w katalogu głównym dysku"
body = "Elementy leżące bezpośrednio w katalogu głównym dysku: {n}\n\n{list}\n\nTen poziom zwykle zawiera foldery systemowe lub główne foldery projektów — usuwanie tutaj ma szeroki wpływ. Mimo to {how}?"

[delete.locked]
title = "Plik jest w użyciu"
body = "Te programy mają otwarte pliki:\n\n{list}\n\nWymuszone zamknięcie ich dojść pozwoli usunąć pliki, ale programy nie będą wiedzieć, że dojście zniknęło — kolejne odczyty lub zapisy się nie powiodą, a niezapisane dane mogą zostać utracone.\n\nWymusić odblokowanie i usunąć?"

[delete.locked_still]
title = "Nadal w użyciu"
body = "Nadal nie można usunąć po zamknięciu dojść.\n\n{list}\n\nZakończyć te programy i spróbować ponownie? Ich niezapisane dane zostaną utracone."

