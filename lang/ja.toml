# OB Commander 日本語
# 言語を追加するには: このファイルをコピーして言語タグの名前 (例: ja-JP.toml) に変更し、
# 各「=」の右側のテキストを翻訳してください。
# exe と同じ場所にある lang/ フォルダーに置くと自動的に読み込まれます。
# 同じ名前のファイルは組み込みのものより優先されます。
# {波かっこ} は実行時に値が入るプレースホルダーです。位置は変えてもかまいませんが、削除しないでください。

name = "日本語"

[delete]
verb = "削除"
verb_permanent = "完全に削除"
more_items = "\n    ... ほか {n} 項目"
locker_line = "    {name} (PID {pid}、ハンドル {n} 個)"

[delete.root]
title = "ドライブのルートにある項目の削除"
body = "{n} 個の項目がドライブのルート直下にあります:\n\n{list}\n\nこの階層には通常、システムやプロジェクトのルートがあり、ここでの削除は広い範囲に影響します。それでも{how}しますか？"

[delete.locked]
title = "ファイルは使用中です"
body = "次のプログラムがファイルを開いています:\n\n{list}\n\nこれらのハンドルを強制的に閉じると削除できますが、各プログラムはハンドルが閉じられたことを認識しません。以降の読み書きは失敗し、保存されていないデータが失われる可能性があります。\n\n強制的にロックを解除して削除しますか？"

[delete.locked_still]
title = "まだ使用中です"
body = "ハンドルを閉じても削除できませんでした。\n\n{list}\n\nこれらのプログラムを終了して再試行しますか？保存されていないデータは失われます。"

