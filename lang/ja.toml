# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Pro 機能"
trial = "30 日間無料で試す"
buy = "Pro 版について"
activate = "ライセンス キーを入力"

[pro.preview]
title = "表示とクイック ビューは Pro 機能です"
body = "F3 ビューアーと Ctrl+Q クイック ビューでは、テキストやコード、画像、PDF、Office ドキュメント、Markdown、Web ページ、SQLite データベース、音声、動画を、別のプログラムを開かずに表示できます。F4 を押すとビューアー内でそのまま編集できます。\n\n無料版でも、ファイルをダブルクリックすれば既定のプログラムで開けます。"

[pro.archive]
title = "アーカイブのフォルダー参照は Pro 機能です"
body = "zip、7z、rar、iso、jar / war などのアーカイブをフォルダーのように開けます。ファイルをコピーするとそのまま展開され、先にディスクへ展開する必要はありません。\n\n無料版でも、アーカイブをダブルクリックすれば既定のプログラムで開けます。"

[pro.compare]
title = "フォルダーの比較は Pro 機能です"
body = "2 つのパネルを項目ごとに比較します。片側にしかないものや内容が異なるものがひと目でわかり、反対側へコピーして同期できます。"

[pro.usercmd]
title = "カスタム コマンドは Pro 機能です"
body = "毎日使うコマンドライン ツールをメニュー、ツール バー、ショートカット キーに登録し、選択したファイルに対してワンステップで実行できます。"

[pro.remote]
title = "リモート SFTP は Pro 機能です"
body = "OB Commander の中でサーバーのディレクトリを直接参照できます。アップロード、ダウンロード、名前の変更、削除、フォルダーの作成など、ローカル ドライブと同じように操作できます。\n\n既存の SSH 設定 (キー、エージェント、踏み台ホスト、~/.ssh/config のホスト エイリアス) をそのまま使います。二重に設定する必要はありません。\n\nその他の基本機能は、個人および家庭での使用であれば引き続き無料です。"

