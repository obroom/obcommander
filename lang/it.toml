# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Funzionalità Pro"
trial = "Prova gratis per 30 giorni"
buy = "Informazioni su Pro"
activate = "Inserisci codice di licenza"

[pro.preview]
title = "Il visualizzatore e la visualizzazione rapida sono funzionalità Pro"
body = "Il visualizzatore F3 e la visualizzazione rapida Ctrl+Q mostrano testo e codice, immagini, PDF, documenti Office, Markdown, pagine web, database SQLite, audio e video senza aprire un altro programma; con F4 modifichi direttamente nel visualizzatore.\n\nNella versione gratuita, con un doppio clic su un file lo apri comunque nel programma predefinito."

[pro.archive]
title = "L'esplorazione degli archivi come cartelle è una funzionalità Pro"
body = "Apri archivi zip, 7z, rar, iso, jar / war e altri come se fossero cartelle; copiando i file all'esterno vengono estratti, senza doverli prima decomprimere su disco.\n\nNella versione gratuita, con un doppio clic su un archivio lo apri comunque nel programma predefinito."

[pro.compare]
title = "Il confronto cartelle è una funzionalità Pro"
body = "Confronta i due pannelli elemento per elemento: vedi a colpo d'occhio cosa esiste su un solo lato e cosa è diverso, e copia da un lato all'altro per sincronizzare."

[pro.usercmd]
title = "I comandi personalizzati sono una funzionalità Pro"
body = "Inserisci gli strumenti da riga di comando che usi ogni giorno nel menu, nella barra degli strumenti e nei tasti di scelta rapida, ed eseguili sui file selezionati in un solo passaggio."

[pro.remote]
title = "L'SFTP remoto è una funzionalità Pro"
body = "Esplora le directory di un server direttamente in OB Commander: carica, scarica, rinomina, elimina, crea cartelle, proprio come in un'unità locale.\n\nUsa la configurazione SSH che hai già: chiavi, agent, jump host e gli alias host in ~/.ssh/config. Niente da configurare due volte.\n\nLe altre funzionalità di base restano gratuite per uso personale e domestico."

