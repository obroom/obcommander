# OB Commander Italiano
# Per aggiungere una lingua: copia questo file, rinominalo con il tag della lingua (ad es. ja-JP.toml)
# e traduci il testo a destra di ogni "=".
# Mettilo nella cartella lang/ accanto all'exe e verrà rilevato automaticamente;
# un file con lo stesso nome sostituisce quello integrato.
# Le {parentesi graffe} sono segnaposto compilati in fase di esecuzione: puoi spostarli, ma non eliminarli.

name = "Italiano"

[delete]
verb = "Elimina"
verb_permanent = "Elimina definitivamente"
more_items = "\n    ... e altri {n}"
locker_line = "    {name} (PID {pid}, {n} handle)"

[delete.root]
title = "Eliminazione di elementi nella radice di un'unità"
body = "{n} elemento/i si trovano direttamente nella radice di un'unità:\n\n{list}\n\nQuesto livello contiene di solito cartelle di sistema o radici di progetti: eliminare qui ha un impatto ampio. {how} comunque?"

[delete.locked]
title = "File in uso"
body = "Questi programmi tengono aperti i file:\n\n{list}\n\nForzando la chiusura dei loro handle l'eliminazione può procedere, ma quei programmi non sapranno che l'handle non c'è più: le successive letture o scritture non riusciranno e i dati non salvati potrebbero andare persi.\n\nForzare lo sblocco ed eliminare?"

[delete.locked_still]
title = "Ancora in uso"
body = "Ancora impossibile da eliminare dopo la chiusura degli handle.\n\n{list}\n\nTerminare questi programmi e riprovare? I loro dati non salvati andranno persi."

