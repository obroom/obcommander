# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Функция Pro"
trial = "30 дней бесплатно"
buy = "О версии Pro"
activate = "Ввести лицензионный ключ"

[pro.preview]
title = "Просмотр и быстрый просмотр — функции Pro"
body = "Просмотрщик F3 и быстрый просмотр Ctrl+Q показывают текст и код, изображения, PDF, документы Office, Markdown, веб-страницы, базы данных SQLite, аудио и видео, не открывая других программ; F4 включает редактирование прямо в просмотрщике.\n\nВ бесплатной версии двойной щелчок по файлу по-прежнему открывает его в программе по умолчанию."

[pro.archive]
title = "Просмотр архивов как папок — функция Pro"
body = "Открывайте zip, 7z, rar, iso, jar / war и другие архивы как папки; при копировании файлы извлекаются, распаковывать архив на диск заранее не нужно.\n\nВ бесплатной версии двойной щелчок по архиву по-прежнему открывает его в программе по умолчанию."

[pro.compare]
title = "Сравнение папок — функция Pro"
body = "Сравнивайте две панели поэлементно: сразу видно, что есть только с одной стороны и что различается, а копирование на другую сторону синхронизирует их."

[pro.usercmd]
title = "Пользовательские команды — функция Pro"
body = "Вынесите инструменты командной строки, которыми пользуетесь каждый день, в меню, на панель инструментов и на сочетания клавиш и запускайте их для выделенных файлов одним действием."

[pro.remote]
title = "Удалённый SFTP — функция Pro"
body = "Просматривайте каталоги сервера прямо в OB Commander: загружайте, скачивайте, переименовывайте, удаляйте, создавайте папки — как на локальном диске.\n\nИспользуются уже имеющиеся у вас настройки SSH: ключи, агент, промежуточные узлы и псевдонимы узлов из ~/.ssh/config. Ничего не нужно настраивать повторно.\n\nОстальные базовые функции остаются бесплатными для личного и домашнего использования."

