# OB Commander — русский
# Чтобы добавить язык: скопируйте этот файл, переименуйте его по тегу языка (например, ja-JP.toml)
# и переведите текст справа от каждого «=».
# Положите его в папку lang/ рядом с exe-файлом — он подхватится автоматически;
# файл с тем же именем заменяет встроенный.
# {фигурные скобки} — подстановки, заполняемые во время работы: их можно переносить, но нельзя удалять.

name = "Русский"

[delete]
verb = "Удалить"
verb_permanent = "Удалить навсегда"
more_items = "\n    ... и ещё {n}"
locker_line = "    {name} (PID {pid}, дескрипторов: {n})"

[delete.root]
title = "Удаление в корне диска"
body = "Элементы непосредственно в корне диска ({n}):\n\n{list}\n\nНа этом уровне обычно лежат системные папки или корни проектов — удаление здесь затрагивает многое. {how} всё равно?"

[delete.locked]
title = "Файл используется"
body = "Эти программы держат файлы открытыми:\n\n{list}\n\nПринудительное закрытие их дескрипторов позволит выполнить удаление, но программы не узнают об этом — дальнейшие операции чтения и записи завершатся ошибкой, а несохранённые данные могут быть потеряны.\n\nПринудительно разблокировать и удалить?"

[delete.locked_still]
title = "Файл всё ещё используется"
body = "Удалить не удалось даже после закрытия дескрипторов.\n\n{list}\n\nЗавершить эти программы и повторить? Их несохранённые данные будут потеряны."

