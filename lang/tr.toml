# OB Commander Türkçe
# Yeni bir dil eklemek için: bu dosyayı kopyalayın, adını dil etiketi olarak değiştirin (ör. ja-JP.toml)
# ve her "=" işaretinin sağındaki metni çevirin.
# Dosyayı exe'nin yanındaki lang/ klasörüne koyun, otomatik olarak algılanır;
# aynı adlı bir dosya yerleşik olanın yerine geçer.
# {süslü parantez} içindekiler çalışma anında doldurulan yer tutuculardır; yerlerini değiştirebilirsiniz, ancak silmeyin.

name = "Türkçe"

[delete]
verb = "Sil"
verb_permanent = "Kalıcı olarak sil"
more_items = "\n    ... ve {n} öğe daha"
locker_line = "    {name} (PID {pid}, tanıtıcı sayısı: {n})"

[delete.root]
title = "Sürücü Kökündeki Öğeleri Silme"
body = "Doğrudan sürücü kökünde bulunan öğe sayısı: {n}\n\n{list}\n\nBu düzeyde genellikle sistem veya proje kökleri bulunur; burada silmenin etkisi geniştir. {how}: yine de devam edilsin mi?"

[delete.locked]
title = "Dosya Kullanımda"
body = "Şu programlar dosyaları açık tutuyor:\n\n{list}\n\nTanıtıcılarını zorla kapatmak silme işleminin gerçekleşmesini sağlar, ancak bu programlar tanıtıcının kapandığını bilmez; sonraki okuma veya yazma işlemleri başarısız olur ve kaydedilmemiş veriler kaybolabilir.\n\nKilit zorla açılıp silinsin mi?"

[delete.locked_still]
title = "Hâlâ Kullanımda"
body = "Tanıtıcılar kapatıldıktan sonra da silinemiyor.\n\n{list}\n\nBu programlar sonlandırılıp yeniden denensin mi? Kaydedilmemiş verileri kaybolacak."

