# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Pro özellik"
trial = "30 gün ücretsiz dene"
buy = "Pro hakkında"
activate = "Lisans anahtarı gir"

[pro.preview]
title = "Görüntüleme ve hızlı görünüm Pro özelliklerdir"
body = "F3 görüntüleyici ve Ctrl+Q hızlı görünüm; metin ve kod, resimler, PDF, Office belgeleri, Markdown, web sayfaları, SQLite veritabanları, ses ve video dosyalarını başka bir program açmadan gösterir; F4 ile doğrudan görüntüleyicide düzenleyebilirsiniz.\n\nÜcretsiz sürümde bir dosyaya çift tıklamak onu yine varsayılan programında açar."

[pro.archive]
title = "Arşivlere klasör gibi göz atma bir Pro özelliktir"
body = "zip, 7z, rar, iso, jar / war ve diğer arşivleri klasör gibi açın; dosyaları dışarı kopyalamak onları ayıklar, önce diske açmaya gerek kalmaz.\n\nÜcretsiz sürümde bir arşive çift tıklamak onu yine varsayılan programında açar."

[pro.compare]
title = "Klasör karşılaştırma bir Pro özelliktir"
body = "İki paneli öğe öğe karşılaştırın: yalnızca bir tarafta olanları ve farklı olanları bir bakışta görün, eşitlemek için karşı tarafa kopyalayın."

[pro.usercmd]
title = "Özel komutlar bir Pro özelliktir"
body = "Her gün kullandığınız komut satırı araçlarını menüye, araç çubuğuna ve kısayol tuşlarına yerleştirin; seçili dosyalar üzerinde tek adımda çalıştırın."

[pro.remote]
title = "Uzak SFTP bir Pro özelliktir"
body = "Bir sunucunun dizinlerinde doğrudan OB Commander içinde gezinin: karşıya yükleyin, indirin, yeniden adlandırın, silin, klasör oluşturun; tıpkı yerel bir sürücüdeki gibi.\n\nZaten sahip olduğunuz SSH kurulumunu kullanır: anahtarlar, agent, atlama sunucuları ve ~/.ssh/config içindeki ana bilgisayar diğer adları. Hiçbir şeyi iki kez yapılandırmanız gerekmez.\n\nDiğer temel özellikler kişisel ve ev kullanımı için ücretsiz kalır."

