# ── 专业版功能 (未授权时点到才弹) ───────────────────────
[pro]
title = "专业版功能"
trial = "免费试用 30 天"
buy = "了解专业版"
activate = "输入授权码"

[pro.preview]
title = "查看和快速查看是专业版功能"
body = "F3 查看窗和 Ctrl+Q 快速查看: 文本和代码、图片、PDF、Office 文档、Markdown、网页、SQLite 数据库、音视频, 不用开别的程序就能看; F4 直接在查看窗里编辑。\n\n免费版里双击文件照旧用系统默认程序打开。"

[pro.archive]
title = "压缩包当文件夹逛是专业版功能"
body = "zip、7z、rar、iso、jar / war 等压缩包直接进去浏览, 复制出来就是解压, 不用先解到磁盘上。\n\n免费版里双击压缩包照旧用系统默认程序打开。"

[pro.compare]
title = "比较目录是专业版功能"
body = "左右两个面板逐项对比: 哪些只有一边有、哪些内容不一样, 一眼看清, 还能直接复制过去同步。"

[pro.usercmd]
title = "自定义命令是专业版功能"
body = "把常用的命令行工具挂到菜单、工具栏和快捷键上, 对选中的文件一键运行。"

[pro.remote]
title = "远程 SFTP 是专业版功能"
body = "在 OB Commander 里直接逛服务器目录: 上传下载、改名删除、新建目录, 跟操作本地盘一样。\n\n用的是你现有的 SSH 配置 —— 密钥、agent、跳板机、~/.ssh/config 里的主机别名, 一个都不用重新配。\n\n其余基础功能, 个人和家庭使用照旧免费。"

