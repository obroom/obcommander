# OB Commander 简体中文
# 加新语言: 复制这个文件改名成语言标签 (如 ja-JP.toml), 翻译等号右边的文字即可。
# 放在 exe 旁边的 lang/ 目录里就会被自动加载; 同名会覆盖内置的那份。
# 文案里的 {名字} 是占位符, 运行时会被替换成实际内容, 位置可以调但别删。

name = "简体中文"

[delete]
verb = "删除"
verb_permanent = "永久删除"
more_items = "\n    ... 还有 {n} 项"
locker_line = "    {name} (PID {pid}, {n} 个句柄)"

[delete.root]
title = "删除根目录下的项目"
body = "下面 {n} 项直接位于磁盘根目录下:\n\n{list}\n\n这一层通常是系统目录或项目根目录, 删掉影响面很大。确定要{how}吗?"

[delete.locked]
title = "文件被占用"
body = "以下程序正占用要删除的文件:\n\n{list}\n\n强制关闭它们的文件句柄可以删掉文件, 但这些程序并不知道句柄没了 —— 继续读写会出错, 未保存的数据可能丢失。\n\n要强制解锁并删除吗?"

[delete.locked_still]
title = "仍被占用"
body = "关闭句柄后仍然删不掉。\n\n{list}\n\n要结束这些程序再删吗? 它们未保存的数据会丢失。"

