# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Fonctionnalité Pro"
trial = "Essayer gratuitement 30 jours"
buy = "À propos de Pro"
activate = "Saisir la clé de licence"

[pro.preview]
title = "La visionneuse et l'aperçu rapide sont des fonctionnalités Pro"
body = "La visionneuse F3 et l'aperçu rapide Ctrl+Q affichent le texte et le code, les images, les PDF, les documents Office, le Markdown, les pages web, les bases de données SQLite, l'audio et la vidéo sans ouvrir un autre programme ; F4 permet de modifier directement dans la visionneuse.\n\nDans la version gratuite, un double-clic sur un fichier l'ouvre toujours dans son programme par défaut."

[pro.archive]
title = "La navigation dans les archives comme dans des dossiers est une fonctionnalité Pro"
body = "Ouvrez les archives zip, 7z, rar, iso, jar / war et autres comme des dossiers ; copier des fichiers vers l'extérieur les extrait, sans devoir d'abord tout décompresser sur le disque.\n\nDans la version gratuite, un double-clic sur une archive l'ouvre toujours dans son programme par défaut."

[pro.compare]
title = "La comparaison de dossiers est une fonctionnalité Pro"
body = "Comparez les deux panneaux élément par élément : voyez d'un coup d'œil ce qui n'existe que d'un côté et ce qui diffère, puis copiez d'un côté à l'autre pour synchroniser."

[pro.usercmd]
title = "Les commandes personnalisées sont une fonctionnalité Pro"
body = "Placez les outils en ligne de commande que vous utilisez tous les jours dans le menu, la barre d'outils et les raccourcis clavier, et exécutez-les sur les fichiers sélectionnés en une seule étape."

[pro.remote]
title = "Le SFTP distant est une fonctionnalité Pro"
body = "Parcourez les répertoires d'un serveur directement dans OB Commander : envoi, téléchargement, renommage, suppression, création de dossiers — comme sur un lecteur local.\n\nIl utilise la configuration SSH que vous avez déjà : clés, agent, hôtes de rebond et alias d'hôtes de ~/.ssh/config. Rien à configurer deux fois.\n\nLes autres fonctionnalités de base restent gratuites pour un usage personnel et domestique."

