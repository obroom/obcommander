# OB Commander Français
# Pour ajouter une langue : copiez ce fichier, renommez-le avec l'étiquette de la langue (par ex. ja-JP.toml),
# puis traduisez le texte à droite de chaque « = ».
# Déposez-le dans le dossier lang/ à côté de l'exe : il est pris en compte automatiquement ;
# un fichier portant le même nom remplace le fichier intégré.
# Les {accolades} sont des espaces réservés remplis à l'exécution — vous pouvez les déplacer, mais pas les supprimer.

name = "Français"

[delete]
verb = "Supprimer"
verb_permanent = "Supprimer définitivement"
more_items = "\n    ... et {n} de plus"
locker_line = "    {name} (PID {pid}, {n} descripteur(s))"

[delete.root]
title = "Suppression d'éléments à la racine d'un lecteur"
body = "{n} élément(s) se trouvent directement à la racine d'un lecteur :\n\n{list}\n\nCe niveau contient généralement des dossiers système ou des racines de projets — une suppression ici a des conséquences étendues. {how} quand même ?"

[delete.locked]
title = "Fichier en cours d'utilisation"
body = "Ces programmes maintiennent le ou les fichiers ouverts :\n\n{list}\n\nForcer la fermeture de leurs descripteurs permet la suppression, mais ces programmes ne sauront pas que le descripteur a disparu — leurs lectures ou écritures suivantes échoueront et les données non enregistrées risquent d'être perdues.\n\nForcer le déverrouillage et supprimer ?"

[delete.locked_still]
title = "Toujours en cours d'utilisation"
body = "Toujours impossible à supprimer après la fermeture des descripteurs.\n\n{list}\n\nFermer ces programmes et réessayer ? Leurs données non enregistrées seront perdues."

