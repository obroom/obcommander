# ── License (license.rs) ────────────────────────────────
[license]
# The line that always shows in the About box
licensed_to = "Con licencia para {email}"
personal_use = "Uso personal y doméstico (gratuito)"
about_trial = "Prueba de Pro (quedan {days} días)"
# Help > License
active = "Con licencia"
active_body = "Con licencia para {email}\nEmitida el {date}\n\nGracias por su apoyo."
free = "Gratuito para uso personal y doméstico"
free_body = "El uso personal y doméstico (no comercial) de las funciones básicas es gratuito.\n\nSe requiere una licencia para:\n  · uso comercial: uso para una empresa, una organización o por trabajo, incluido el trabajo autónomo y el trabajo desde casa (evaluación gratuita durante 30 días)\n  · funciones Pro: visor F3 y vista rápida Ctrl+Q, explorar archivos comprimidos como carpetas, tamaños de carpeta recordados, comparación de carpetas, comandos personalizados, SFTP remoto\n\nPro se puede probar gratis durante 30 días, sin tarjeta. El contrato de licencia contiene las definiciones exactas."
# trial
trial = "Prueba de Pro: quedan {days} días"
trial_body = "La prueba dura hasta el {date}. Todas las funciones Pro están disponibles hasta entonces.\n\nDespués volverá a la versión gratuita; sus archivos y su configuración no se verán afectados. Compre una licencia e introduzca el código para conservar Pro."
trial_over = "La prueba de Pro ha finalizado"
trial_over_body = "La prueba finalizó el {date}. Las funciones Pro están desactivadas; las funciones básicas siguen funcionando (gratuitas para uso personal y doméstico).\n\nCompre una licencia e introduzca el código para recuperar Pro."
trial_ended_on = "La prueba finalizó el {date}."
trial_started = "Prueba iniciada"
trial_started_body = "Todas las funciones Pro están disponibles hasta el {date}.\n\nNo se requiere tarjeta: al finalizar, volverá automáticamente a la versión gratuita."
trial_used = "Este equipo ya ha usado una prueba"
trial_used_body = "La prueba en este equipo finalizó el {date}. Cada equipo puede usar la prueba una sola vez.\n\nCompre una licencia e introduzca el código para usar Pro."
paste_hint = "Pegue la clave de licencia del correo de compra, por ejemplo ABCDE-FGHIJ-KLMNO-PQRST-UVWXY"
ok = "Activado"
ok_body = "Con licencia para {email}. Gracias por su apoyo."
bad = "La clave de licencia no ha funcionado"
bad_body = "Es posible que no se haya copiado completa o que no sea una clave de este programa.\n\nVuelva a copiar la clave completa del correo de compra."
# code is valid but cannot be saved next to the exe
cant_save = "Código válido, pero no se pudo guardar"
cant_save_body = "El código es correcto, pero no se pudo escribir en {path}.\n\nLo más probable es que el programa esté instalado en una carpeta que requiere derechos de administrador. Ejecútelo una vez como administrador y vuelva a activarlo, o mueva el programa a una ubicación donde pueda escribir (es portable: basta con copiar la carpeta)."
# activating / starting a trial contacts the license server once
net = "No se puede conectar con el servidor de licencias"
net_body = "Compruebe la conexión e inténtelo de nuevo.\n\nEs posible que una red corporativa esté bloqueando {host}: pida a su equipo de TI que lo permita, o escriba a support@obcommander.com y le ayudaremos."
server = "El servidor de licencias tiene un problema"
server_body = "Inténtelo de nuevo en unos minutos. Si sigue fallando, escriba a support@obcommander.com."
limit = "Esta clave de licencia no tiene activaciones disponibles"
limit_body = "Cada licencia se puede usar en 2 equipos. En el equipo que ya no usa, abra Ayuda > Licencia > Desactivar en este equipo y, a continuación, active aquí.\n\nSi el equipo anterior está averiado o se restableció sin desactivar, escriba a support@obcommander.com y lo restableceremos."
revoked = "Esta clave de licencia se ha deshabilitado"
revoked_body = "El pedido se reembolsó o la clave se deshabilitó. Si tiene preguntas, escriba a support@obcommander.com."
# deactivate: free the seat for another computer
deactivate = "Desactivar en este equipo"
deactivate_confirm = "¿Desactivar en este equipo?"
deactivate_body = "Este equipo volverá a la versión gratuita y la activación quedará disponible para otro equipo.\n\nPara volver a usar Pro aquí más adelante, basta con introducir de nuevo la clave de licencia."
