# OB Commander en español
# Para agregar un idioma: copie este archivo, cámbiele el nombre por la etiqueta del idioma (p. ej. ja-JP.toml)
# y traduzca el texto que aparece a la derecha de cada "=".
# Colóquelo en la carpeta lang/ junto al exe y se cargará automáticamente;
# un archivo con el mismo nombre reemplaza al integrado.
# Las {llaves} son marcadores que se rellenan en tiempo de ejecución: puede moverlos, pero no eliminarlos.

name = "Español"

[delete]
verb = "Eliminar"
verb_permanent = "Eliminar permanentemente"
more_items = "\n    ... y {n} más"
locker_line = "    {name} (PID {pid}, {n} identificador(es))"

[delete.root]
title = "Eliminar elementos en la raíz de una unidad"
body = "{n} elemento(s) están directamente en la raíz de una unidad:\n\n{list}\n\nEste nivel suele contener raíces del sistema o de proyectos; eliminar aquí tiene un gran impacto. ¿{how} de todos modos?"

[delete.locked]
title = "Archivo en uso"
body = "Estos programas mantienen abierto(s) el/los archivo(s):\n\n{list}\n\nForzar el cierre de sus identificadores permite completar la eliminación, pero esos programas no sabrán que el identificador ya no existe: las lecturas o escrituras posteriores fallarán y podrían perderse datos no guardados.\n\n¿Forzar el desbloqueo y eliminar?"

[delete.locked_still]
title = "Todavía en uso"
body = "Sigue sin poder eliminarse después de cerrar los identificadores.\n\n{list}\n\n¿Finalizar estos programas e intentarlo de nuevo? Se perderán sus datos no guardados."

