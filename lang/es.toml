# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Función Pro"
trial = "Probar gratis 30 días"
buy = "Acerca de Pro"
activate = "Introducir clave de licencia"

[pro.preview]
title = "El visor y la vista rápida son funciones Pro"
body = "El visor F3 y la vista rápida Ctrl+Q muestran texto y código, imágenes, PDF, documentos de Office, Markdown, páginas web, bases de datos SQLite, audio y video sin abrir otro programa; F4 permite editar directamente en el visor.\n\nEn la versión gratuita, al hacer doble clic en un archivo se sigue abriendo en su programa predeterminado."

[pro.archive]
title = "Explorar archivos comprimidos como carpetas es una función Pro"
body = "Abra archivos zip, 7z, rar, iso, jar / war y otros como si fueran carpetas; al copiar archivos desde ellos se extraen, sin necesidad de descomprimir antes en el disco.\n\nEn la versión gratuita, al hacer doble clic en un archivo comprimido se sigue abriendo en su programa predeterminado."

[pro.compare]
title = "La comparación de carpetas es una función Pro"
body = "Compare los dos paneles elemento por elemento: vea de un vistazo qué existe solo en un lado y qué difiere, y copie de un lado a otro para sincronizar."

[pro.usercmd]
title = "Los comandos personalizados son una función Pro"
body = "Coloque las herramientas de línea de comandos que usa a diario en el menú, la barra de herramientas y las teclas de acceso rápido, y ejecútelas sobre los archivos seleccionados en un solo paso."

[pro.remote]
title = "SFTP remoto es una función Pro"
body = "Explore los directorios de un servidor directamente en OB Commander: subir, descargar, cambiar nombre, eliminar, crear carpetas, igual que en una unidad local.\n\nUsa la configuración SSH que ya tiene: claves, agente, hosts de salto y los alias de host de ~/.ssh/config. No hay que configurar nada dos veces.\n\nLas demás funciones básicas siguen siendo gratuitas para uso personal y doméstico."

