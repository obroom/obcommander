# ── Pro features (shown only when an unlicensed user reaches for one) ──
[pro]
title = "Recurso Pro"
trial = "Avaliar grátis por 30 dias"
buy = "Sobre o Pro"
activate = "Digitar chave de licença"

[pro.preview]
title = "Visualização e exibição rápida são recursos Pro"
body = "O visualizador F3 e a exibição rápida Ctrl+Q mostram texto e código, imagens, PDF, documentos do Office, Markdown, páginas da Web, bancos de dados SQLite, áudio e vídeo sem abrir outro programa; F4 edita direto no visualizador.\n\nNa versão gratuita, clicar duas vezes em um arquivo continua abrindo-o no programa padrão."

[pro.archive]
title = "Navegar em arquivos compactados como pastas é um recurso Pro"
body = "Abra zip, 7z, rar, iso, jar / war e outros arquivos compactados como pastas; copiar arquivos de dentro deles os extrai, sem precisar descompactar no disco antes.\n\nNa versão gratuita, clicar duas vezes em um arquivo compactado continua abrindo-o no programa padrão."

[pro.compare]
title = "Comparação de pastas é um recurso Pro"
body = "Compare os dois painéis item por item: veja rapidamente o que existe só de um lado e o que é diferente, e copie de um lado para o outro para sincronizar."

[pro.usercmd]
title = "Comandos personalizados são um recurso Pro"
body = "Coloque as ferramentas de linha de comando que você usa todo dia no menu, na barra de ferramentas e em teclas de atalho, e execute-as nos arquivos selecionados em uma só etapa."

[pro.remote]
title = "SFTP remoto é um recurso Pro"
body = "Navegue pelos diretórios de um servidor direto no OB Commander: carregue, baixe, renomeie, exclua, crie pastas — como em uma unidade local.\n\nEle usa a configuração SSH que você já tem: chaves, agente, hosts de salto e os aliases de host em ~/.ssh/config. Nada para configurar duas vezes.\n\nOs demais recursos básicos continuam gratuitos para uso pessoal e doméstico."

