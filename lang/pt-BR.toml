# OB Commander Português (Brasil)
# Para adicionar um idioma: copie este arquivo, renomeie-o com a tag do idioma (por ex. ja-JP.toml)
# e traduza o texto à direita de cada "=".
# Coloque-o na pasta lang/ ao lado do exe e ele será carregado automaticamente;
# um arquivo com o mesmo nome substitui o embutido.
# {chaves} são espaços reservados preenchidos em tempo de execução — você pode movê-los, mas não excluí-los.

name = "Português (Brasil)"

[delete]
verb = "Excluir"
verb_permanent = "Excluir permanentemente"
more_items = "\n    ... e mais {n}"
locker_line = "    {name} (PID {pid}, {n} identificador(es))"

[delete.root]
title = "Excluindo itens na raiz de uma unidade"
body = "{n} item(ns) estão diretamente na raiz de uma unidade:\n\n{list}\n\nEste nível costuma conter raízes de sistema ou de projetos — excluir aqui tem grande impacto. {how} mesmo assim?"

[delete.locked]
title = "Arquivo em uso"
body = "Estes programas estão mantendo o(s) arquivo(s) aberto(s):\n\n{list}\n\nForçar o fechamento dos identificadores permite concluir a exclusão, mas esses programas não saberão que o identificador sumiu — leituras ou gravações posteriores falharão e dados não salvos podem ser perdidos.\n\nForçar o desbloqueio e excluir?"

[delete.locked_still]
title = "Ainda em uso"
body = "Ainda não é possível excluir após fechar os identificadores.\n\n{list}\n\nEncerrar estes programas e tentar novamente? Os dados não salvos deles serão perdidos."

