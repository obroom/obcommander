trial_body = "Sua avaliação vai até {date}. Todos os recursos Pro estão disponíveis até lá.\n\nDepois disso, você volta para a versão gratuita; seus arquivos e configurações não são afetados. Compre uma licença e digite o código para continuar com o Pro."
