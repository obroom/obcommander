free_body = "O uso pessoal e doméstico (não comercial) dos recursos básicos é gratuito.\n\nÉ necessária uma licença para:\n  · uso comercial: uso para uma empresa, uma organização ou para trabalho, incluindo trabalho autônomo e trabalho em casa (avaliação gratuita por 30 dias)\n  · recursos Pro: visualizador F3 e exibição rápida Ctrl+Q, navegação em arquivos compactados como pastas, tamanhos de pasta memorizados, comparação de pastas, comandos personalizados, SFTP remoto\n\nO Pro pode ser avaliado gratuitamente por 30 dias, sem cartão. O contrato de licença traz as definições exatas."
# trial
